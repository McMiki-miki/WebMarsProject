<!DOCTYPE html>
<html lang="uk">

</head>
<body>

  <header>
      <nav class="navbar">
  <ul>

    <li><a href="mars-map.html">MARS MAP</a></li>

    <li><a href="quiz.html">QUIZ</a></li>
  </ul>
 
</nav>
    <div class="header-left">
     
      <div>
  
      </div>
    </div>
    <div class="header-right">
      <div class="status">
        <div class="status-dot"></div>
       
      </div>
      
    </div>
  </header>

  <main>
    <div class="map-wrap" id="mapWrap">
      <img src="../img/FinalBase2.png" alt="Марсіанська база" draggable="false" />
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">
      <div class="modal-top-bar" id="modalTopBar"></div>
      <div class="modal-image">
        <img id="modalImg" src="" alt="" />
        <div class="modal-image-grad"></div>
        <div class="modal-image-info">
          <div class="modal-icon" id="modalIcon"></div>
          <div>
            <div class="modal-tag" id="modalTag">Об'єкт колонії</div>
            <div class="modal-name" id="modalName"></div>
          </div>
        </div>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc" id="modalDesc"></p>
        <div class="modal-stats" id="modalStats"></div>
        <div class="modal-details">
          <div class="modal-details-title">Деталі об'єкту</div>
          <ul id="modalDetailsList"></ul>
        </div>
      </div>
      <div class="modal-footer">
        <div class="modal-status">
          <div class="modal-status-dot"></div>
          Статус: Активний
        </div>
        <button class="modal-close-btn" id="modalCloseBtn">Закрити</button>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
